name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clinic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic
      DIRECT_DATABASE_URL: postgresql://clinic:clinic@localhost:5432/clinic
      JWT_SECRET: ci-only-secret
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Apply migrations and seed (validates schema + seed script)
        working-directory: apps/api
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - name: Build
        run: npm run build

      - name: API smoke test
        working-directory: apps/api
        run: |
          node dist/main.js &
          for i in $(seq 1 20); do curl -sf localhost:4000/health && break; sleep 1; done
          TOKEN=$(curl -sf localhost:4000/auth/login -H 'Content-Type: application/json' \
            -d '{"email":"patient1@clinic.test","password":"Password123!"}' | node -pe 'JSON.parse(require("fs").readFileSync(0)).accessToken')
          # Patients must not be able to start calls
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' localhost:4000/calls -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' -d '{"patientId":"x","type":"AUDIO"}')
          echo "patient POST /calls -> $STATUS"
          test "$STATUS" = "403"
